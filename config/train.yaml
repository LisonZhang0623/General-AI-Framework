experiment_name: exp_001
output_dir: outputs/exp_001
seed: 42

model:
  name: easymodel

data:
  train_path: 'D:\Datasets\Polyp_Datasets_with_depths\TrainDataset'
  valid_path: 'D:\Datasets\Polyp_Datasets_with_depths\TestDataset\CVC-300'
  num_workers: 8
  image_size: 224

train:
  epochs: 5
  batch_size: 8
  lr: 1e-3
  optimizer: AdamW
  lr_schedule: StepLR
  scheduler_params:
    step_size: 20
    gamma: 0.1
  weight_decay: 1e-4
  grad_accum_steps: 1
  mixed_precision: 'no'   # no / fp16 / bf16
  log_interval: 20

save:
  save_every_epoch: 1
  max_checkpoints: 3